[PHP]
; Basic settings
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
post_max_size = 512M
upload_max_filesize = 512M
max_file_uploads = 20

; For WooCommerce & AJAX requests
max_input_vars = 3000
max_input_nesting_level = 64

; Session settings
session.gc_maxlifetime = 7200
session.cookie_lifetime = 0

; Error reporting (disable in production)
display_errors = On
log_errors = On
error_log = /usr/local/lsws/logs/php_errors.log

; OPcache settings
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.enable_file_override = 1

; Realpath cache
realpath_cache_size = 2048K
realpath_cache_ttl = 600

; Date settings
date.timezone = Asia/Ho_Chi_Minh

; MySQL settings
mysql.default_host = mysql2
mysql.default_user = ${MYSQL_USER}
mysql.default_password = ${MYSQL_PASSWORD}

; MySQLi settings
mysqli.default_host = mysql2
mysqli.default_user = ${MYSQL_USER}
mysqli.default_pw = ${MYSQL_PASSWORD}

; PDO MySQL settings
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock

; Database connection settings
mysql.connect_timeout = 60
mysqli.default_socket = /var/run/mysqld/mysqld.sock
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock
